
<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bảng báo giá bia</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--ink:#17120e;--gold:#c9a24a;--gold2:#e8cf8e;--red:#b3141b;--cream:#f4efe6}
*{box-sizing:border-box}body{margin:0;background:#d9d4ca;font-family:'Be Vietnam Pro',Arial,sans-serif;color:var(--ink)}
#bar{position:sticky;top:0;z-index:20;background:#17120e;color:#fff;display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap}
#bar b{font-family:Oswald,sans-serif;letter-spacing:.06em;color:var(--gold2);margin-right:auto}
button{font:600 13px 'Be Vietnam Pro',Arial;border:0;border-radius:6px;padding:8px 13px;cursor:pointer;background:#3a322a;color:#fff}
button.p{background:var(--gold);color:#17120e}button.r{background:var(--red)}button:hover{filter:brightness(1.12)}
#wrap{padding:18px;overflow-x:auto}
#sheet{width:min(900px,100%);margin:0 auto;background:var(--cream);box-shadow:0 8px 30px #0005}
#sheet.fx{width:900px}
.hd{background:linear-gradient(135deg,#17120e,#2b1a12);color:#fff;padding:22px 34px;display:flex;align-items:center;gap:18px;border-bottom:5px solid var(--gold)}
.hd img{height:54px;max-width:150px;object-fit:contain}
.hd .co{font:700 17px Montserrat,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--gold2)}
.hd .hl{margin-left:auto;text-align:right;font-size:12px;letter-spacing:.14em;color:#cbbfa9}
.hd .hl b{display:block;font:800 24px Montserrat,Arial,sans-serif;letter-spacing:.02em;color:#fff}
.ti{text-align:center;padding:26px 30px 10px}
.ti h1{margin:0;font:800 34px Montserrat,Arial,sans-serif;letter-spacing:.08em;color:var(--red)}
.ti .ln{width:90px;height:3px;background:var(--gold);margin:10px auto}
.ti p{margin:0;font-size:14px;color:#5a4d3e}
.meta{display:flex;justify-content:space-between;padding:12px 34px 4px;font-size:13px;color:#3d3328}
.list{padding:10px 34px 6px}
.card{display:flex;background:#fff;border:1px solid #e3d9c4;border-left:6px solid var(--red);border-radius:6px;margin:14px 0;overflow:hidden;box-shadow:0 2px 8px #0001}
.pic{flex:0 0 280px;display:flex;align-items:center;justify-content:center;padding:14px;background:radial-gradient(circle at 50% 55%,#fff 30%,#f1e9d8)}
.pic img{max-width:100%;max-height:230px;object-fit:contain}
.inf{flex:1;padding:18px 22px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.inf h3{margin:0;font:600 23px Oswald;letter-spacing:.03em;text-transform:uppercase}
.sp{display:inline-block;align-self:flex-start;margin:6px 0 10px;background:#17120e;color:var(--gold2);font-size:12px;padding:3px 10px;border-radius:20px}
.pl{font-size:11px;letter-spacing:.12em;color:#7b6c58;text-transform:uppercase}
.pr{font:700 34px Oswald;color:var(--red);line-height:1.1}.pr small{font:500 14px 'Be Vietnam Pro';color:#5a4d3e}
.pm{margin-top:12px;border:1.5px dashed var(--gold);border-radius:6px;background:#fffaf0}
.ph{background:var(--gold);color:#17120e;font:600 12px Oswald;letter-spacing:.14em;padding:4px 12px}
.t{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:14px}
.t+.t{border-top:1px dotted #d8c79b}.t b{color:var(--red);font-size:16px}.t strong{font:700 20px Oswald;color:var(--red)}
.t strong{text-align:right}.t.tx span{font-weight:600;white-space:pre-line}#dr select{width:100%;padding:7px 8px;border:1px solid #cfc4ae;border-radius:5px;font:13px 'Be Vietnam Pro';background:#fff}.row select{flex:1}
.ft{margin:8px 34px 0;padding:14px 0;border-top:2px solid var(--gold);font-size:12px;color:#4d4236;line-height:1.7}
.fb{background:#17120e;color:#fff;text-align:center;padding:14px;font:700 17px Montserrat,Arial,sans-serif;letter-spacing:.05em}.fb span{color:var(--gold2)}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:#fff;z-index:30;transform:translateX(105%);transition:.25s;overflow:auto;padding:14px;box-shadow:-6px 0 24px #0006}
#dr.o{transform:none}#dr h4{margin:14px 0 6px;font:600 15px Oswald;letter-spacing:.08em;color:var(--red);text-transform:uppercase}
#dr label{display:block;font-size:11px;color:#6b5d4b;margin:7px 0 2px}
#dr input,#dr textarea{width:100%;padding:7px 8px;border:1px solid #cfc4ae;border-radius:5px;font:13px 'Be Vietnam Pro'}
.pb{border:1px solid #d9cdb4;border-radius:8px;padding:10px;margin:10px 0;background:#faf6ec}
.row{display:flex;gap:6px;align-items:end}.row>div{flex:1}.row button{padding:7px 10px}
.mini{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.mini button{padding:6px 9px;font-size:12px}
#ov{position:fixed;inset:0;background:#000c;z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}.ob{background:#fff;border-radius:10px;padding:14px;max-width:420px;width:100%;max-height:92vh;overflow:auto;font-size:13px}.ob img{width:100%;margin:10px 0;border:1px solid #ddd}.bt{display:inline-block;font:600 13px 'Be Vietnam Pro',Arial;padding:8px 13px;border-radius:6px;background:var(--red);color:#fff;text-decoration:none}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17120e;color:#fff;padding:10px 18px;border-radius:8px;z-index:50;display:none;font-size:13px}
@media(max-width:640px){.ti h1{font-size:24px}.card{flex-direction:column}.pic{flex-basis:auto}.hd{flex-wrap:wrap}.hd .hl{margin-left:0;text-align:left}}
</style></head><body>

<div id="wrap"><div id="sheet"></div></div>

<div class="ti"><h1>${esc(S.title)}</h1><div class="ln"></div><p>${esc(S.sub)}</p></div>
<div class="meta"><span>Kính gửi: <b>${esc(S.to)}</b></span><span>Ngày: <b>${esc(S.date||today())}</b></span></div>
<div class="list">${S.products.map(p=>`<div class="card"><div class="pic">${p.img?`<img src="${p.img}">`:''}</div><div class="inf"><h3>${esc(p.name)}</h3><span class="sp">${esc(p.spec)}</span>
<div class="pl">Giá niêm yết</div><div class="pr">${fm(p.price)}<small> / thùng</small></div>
${p.tiers.length?`<div class="pm"><div class="ph">★ ƯU ĐÃI ĐẶC BIỆT</div>${p.tiers.map(tr).join('')}</div>`:''}</div></div>`).join('')}</div>
<div class="ft">${S.note.split('\n').filter(x=>x.trim()).map(x=>'• '+esc(x)).join('<br>')}</div>
${S.slogan&&S.slogan.trim()?`<div class="fb">${esc(S.slogan)}</div>`:''}`}
const db=(f,ms)=>{let t;return()=>{clearTimeout(t);t=setTimeout(f,ms)}},dsv=db(save,800),dsh=db(sheet,250);
function set(k,v){S[k]=v;dsv();dsh()}
function up(i,k,v){S.products[i][k]=k==='price'?+v:v;dsv();dsh()}
function ut(i,j,k,v){S.products[i].tiers[j][k]=+v;dsv();dsh()}
function struct(f){f();save();sheet();drawer()}
function img(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*m;c.height=im.height*m;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.9))};im.src=r.result};r.readAsDataURL(file)}
function tr(t){const ty=t.t||'price';
if(ty==='gift')return `<div class="t"><span>Mua <b>${esc(t.q)}</b> thùng</span><strong style="font-size:16px">🎁 TẶNG ${esc(t.g)} thùng ${t.gt==='other'?esc(t.gn||'loại khác'):'cùng loại'}</strong></div>`;
if(ty==='text')return `<div class="t tx"><span>${esc(t.x)}</span></div>`;
return `<div class="t"><span>Nhập <b>${esc(t.q)}</b> thùng còn</span><strong>${fm(t.p)}<small style="font:500 12px 'Be Vietnam Pro'"> /thùng</small></strong></div>`}
function tt(i,j,v){const p=S.products[i],o=p.tiers[j];p.tiers[j]=v==='gift'?{t:'gift',q:o.q||10,g:1,gt:'same',gn:''}:v==='text'?{t:'text',x:''}:{t:'price',q:o.q||10,p:o.p||p.price}}
function us(i,j,k,v){S.products[i].tiers[j][k]=v;dsv();dsh()}
function te(i,j,t){const ty=t.t||'price',o=(v,l)=>`<option value="${v}"${ty===v?' selected':''}>${l}</option>`;
const hd=`<div class="row"><select onchange="struct(()=>tt(${i},${j},this.value))">${o('price','1. Chiết khấu giá')}${o('gift','2. Mua X tặng Y')}${o('text','3. Nhập text tự do')}</select><button class="r" onclick="struct(()=>S.products[${i}].tiers.splice(${j},1))">✕</button></div>`;
let b;
if(ty==='gift')b=`<div class="row"><div><label>Mua (thùng)</label><input type="number" value="${t.q}" oninput="ut(${i},${j},'q',this.value)"></div><div><label>Tặng (thùng)</label><input type="number" value="${t.g}" oninput="ut(${i},${j},'g',this.value)"></div></div><label>Loại hàng tặng</label><select onchange="struct(()=>S.products[${i}].tiers[${j}].gt=this.value)"><option value="same"${t.gt!=='other'?' selected':''}>Cùng loại</option><option value="other"${t.gt==='other'?' selected':''}>Loại khác</option></select>${t.gt==='other'?`<input list="pn" placeholder="Tên sản phẩm tặng" value="${esc(t.gn)}" oninput="us(${i},${j},'gn',this.value)" style="margin-top:5px">`:''}`;
else if(ty==='text')b=`<label>Nội dung ưu đãi</label><textarea rows="2" placeholder="VD: Giảm 5% cho đơn từ 50 thùng" oninput="us(${i},${j},'x',this.value)">${esc(t.x)}</textarea>`;
else b=`<div class="row"><div><label>Nhập (thùng)</label><input type="number" value="${t.q}" oninput="ut(${i},${j},'q',this.value)"></div><div><label>Giá còn (k/thùng)</label><input type="number" value="${t.p}" oninput="ut(${i},${j},'p',this.value)"></div></div>`;
return `<div style="border:1px solid #d9cdb4;border-radius:6px;padding:7px;margin:6px 0;background:#fff">${hd}${b}</div>`}
function drawer(){const f=(k,l,t)=>`<label>${l}</label>${t?`<textarea rows="4" oninput="set('${k}',this.value)">${esc(S[k])}</textarea>`:`<input value="${esc(S[k])}" oninput="set('${k}',this.value)">`}`;
$('dr').innerHTML=`<div class="row"><b style="font:600 18px Oswald;flex:1">CẤU HÌNH BÁO GIÁ</b><button onclick="dr.classList.remove('o')">✕ Đóng</button></div>
<h4>Thông tin chung</h4>${f('co','Tên đơn vị')}${f('title','Tiêu đề')}${f('sub','Phụ đề')}${f('to','Kính gửi')}${f('date','Ngày báo giá (để trống = tự lấy hôm nay)')}${f('hotline','Hotline')}${f('slogan','Slogan / lời kết cuối trang (để trống = ẩn)')}${f('note','Ghi chú chân trang (mỗi dòng một ý)',1)}
<label>Logo (tuỳ chọn)</label><input type="file" accept="image/*" onchange="img(this.files[0],d=>{set('logo',d)})"> ${S.logo?`<button class="mini" onclick="struct(()=>S.logo='')">Xoá logo</button>`:''}
<h4>Sản phẩm & ưu đãi</h4><datalist id="pn">${S.products.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
${S.products.map((p,i)=>`<div class="pb"><b>#${i+1}</b>
${p.img?`<img src="${p.img}" style="height:60px;float:right">`:''}
<label>Tên sản phẩm</label><input value="${esc(p.name)}" oninput="up(${i},'name',this.value)">
<label>Quy cách</label><input value="${esc(p.spec)}" oninput="up(${i},'spec',this.value)">
<label>Giá niêm yết (đơn vị nghìn đồng, VD 425 = 425.000đ)</label><input type="number" value="${p.price}" oninput="up(${i},'price',this.value)">
<label>Đổi hình ảnh</label><input type="file" accept="image/*" onchange="img(this.files[0],d=>struct(()=>S.products[${i}].img=d))">
<label>Ưu đãi đặc biệt</label>
${p.tiers.map((t,j)=>te(i,j,t)).join('')}
<div class="mini"><button class="p" onclick="struct(()=>{const p=S.products[${i}];p.tiers.push({t:'price',q:30,p:p.price})})">+ Mức ưu đãi</button><button onclick="struct(()=>mv(${i},-1))">↑</button><button onclick="struct(()=>mv(${i},1))">↓</button><button class="r" onclick="confirm('Xoá sản phẩm này?')&&struct(()=>S.products.splice(${i},1))">Xoá SP</button></div></div>`).join('')}
<button class="p" style="width:100%" onclick="struct(()=>S.products.push({name:'Sản phẩm mới',spec:'Thùng 24',price:0,img:'',tiers:[{q:10,p:0},{q:20,p:0}]}))">+ Thêm sản phẩm</button>
<h4>Dữ liệu</h4><div class="mini"><button onclick="bk()">💾 Sao lưu (JSON)</button><label style="display:inline"><button onclick="this.nextElementSibling.click()">📂 Khôi phục</button><input type="file" accept=".json" hidden onchange="rs(this.files[0])"></label><button class="r" onclick="confirm('Đặt lại toàn bộ về mặc định?')&&(S=DEF(),save(),sheet(),drawer())">Đặt lại mặc định</button></div>
<p style="font-size:11px;color:#6b5d4b">Cấu hình tự lưu trong trình duyệt này. Nên bấm "Sao lưu" định kỳ để không mất dữ liệu.</p>`}
function mv(i,d){const j=i+d,a=S.products;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='cau-hinh-bao-gia.json';a.click()}
function rs(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products)throw 0;S=d;save();sheet();drawer();toast('Đã khôi phục cấu hình')}catch(e){toast('File không hợp lệ')}};r.readAsText(f)}
async function ex(t){const sh=$('sheet');dr.classList.remove('o');sheet();toast('Đang xuất file...',9000);sh.classList.add('fx');
try{await document.fonts.ready;const c=await html2canvas(sh,{scale:2,backgroundColor:'#ffffff',useCORS:true});const n='Bao-gia-'+(S.date||today()).replace(/\D+/g,'-');let b,pv='';
if(t==='pdf'){const {jsPDF}=window.jspdf,w=c.width/2,h=c.height/2,p=new jsPDF({orientation:w>h?'l':'p',unit:'px',format:[w,h],hotfixes:['px_scaling']});p.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,w,h);b=p.output('blob');pv=c.toDataURL('image/jpeg',.6)}
else b=await new Promise(r=>c.toBlob(r,'image/png'));
$('toast').style.display='none';deliver(b,n+'.'+t,pv||URL.createObjectURL(b))}catch(e){toast('Lỗi xuất file – kiểm tra kết nối internet')}sh.classList.remove('fx')}
function deliver(b,name,pv){const u=URL.createObjectURL(b),mob=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&matchMedia('(pointer:coarse)').matches);
if(!mob){const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);toast('Đã xuất file ✔');return}
const f=new File([b],name,{type:b.type}),can=navigator.canShare&&navigator.canShare({files:[f]});
const o=document.createElement('div');o.id='ov';o.innerHTML=`<div class="ob"><b>Đã tạo xong: ${name}</b><img src="${pv}"><div class="mini">${can?'<button class="p" id="sh">📤 Lưu / Chia sẻ</button>':''}<a class="bt" href="${u}" download="${name}">⬇ Tải về</a><button id="cl">Đóng</button></div></div>`;
document.body.appendChild(o);$('cl').onclick=()=>o.remove();if(can)$('sh').onclick=()=>navigator.share({files:[f],title:name}).catch(()=>{})}
const dr=$('dr');sheet();drawer();addEventListener('pagehide',save);
</script></body></html>
